    - generic [ref=e3]: "# Moghal Saif ## Bio Moghal Saif is a builder, writer, and systems thinker exploring AI, products, strategy, and the inner life behind ambitious work. ## Current - been here since: 2005-02-09T00:00:00+05:30 - current location: Singapore - current project: Mosaic - current project description: A visual knowledge system that saves what I read, connects related ideas, and brings useful notes back when I need them. ## Contact - email: moghalsaif@gmail.com - GitHub: https://github.com/moghalsaif - LinkedIn: https://linkedin.com/in/moghalsaifa - X: https://x.com/moghalsaifa - Instagram: https://instagram.com/moghalsaif - Email: mailto:moghalsaif@gmail.com ## Services - AI implementation - product strategy - technical prototyping - writing and research ## Interests - AI product systems - operator-led businesses - writing about ambition and survival - reading systems, strategy, and consciousness books ## Projects ### Mosaic - id: mosaic - year: 2026 - description: A visual knowledge system that saves what I read, connects related ideas, and brings useful notes back when I need them. - github: https://github.com/moghalsaif ### Drift - id: drift - year: 2024 - description: A calm productivity tool that adapts to energy levels throughout the day and gets out of the way when focus is high. - github: https://github.com/moghalsaif ### Volta - id: volta - year: 2023 - description: An energy-tracking dashboard that turns ambient consumption data into readable, decision-friendly patterns. - github: https://github.com/moghalsaif ### Reframe - id: reframe - year: 2023 - description: A private journaling app that brings back old entries at meaningful intervals so past thinking can become useful again. - github: https://github.com/moghalsaif ### Canvas - id: canvas - year: 2023 - description: A collaborative workspace for structured visual thinking, built around shared blocks and real-time editing. - github: https://github.com/moghalsaif ### Signal - id: signal - year: 2022 - description: A minimal RSS reader for people who want the open web without algorithmic recommendations or engagement metrics. - github: https://github.com/moghalsaif ## Writing ### Everyone is talking about brand, but no one is talking about sales - id: 25 - date: May 2026 - platform: Website - url: local - preview: I interviewed 5 successful businessmen and all of them gave me the same advice. Don't start your own brand if you want to make money. I interviewed 5 successful businessmen and all of them gave me the same advice. Don't start your own brand if you want to make money. See, today everyone wants a founder tag on their LinkedIn. So they start a brand - a clothing brand, a tech agency, a marketing agency, a soft beverage brand, a coffee brand, or a café. Everyone wants to be a founder but nobody is focusing on the money. Most of the brands that people are starting out are losing all of their money, and very rarely do you see a brand succeeding past the 5-year mark. Time is the best filter to understand any business. You don't want to be in a space where your shelf life is less than 5 years. You need to invest your capital, time, and energy into businesses that will compound with time. And I have personally been a victim of this. I started out by first editing video and then pitching myself as a marketing agency, then an AI agency, and ended up with peanuts for the amount of work I put in. Directionally it felt very wrong, so I started checking in with other founders who have been in this space — less than 10 years older than me — and all of them said the same thing: margins are razor thin, and that's just how the service industry works. After that, I spent some time asking founders in my network who have made some decent wealth and have a few grey hairs too. The advice I landed on was: solve a problem for a bigger player than you. All big companies have very niche problems which, for an outsider, might not even be visible. Your first target is to get into the industry and understand the game. Next, you will automatically understand where the gaps are, go ahead and solve them. A good example here is: instead of starting your own AI agency, become an Implementation Partner for Google's AI services. Each time you get a client, Google benefits and pays you for it too. And because the system is handled by Google, you don't have to reinvent the wheel each time. You are only a bridge that makes the sales. If you observe carefully, every D2C brand coming out of India is getting acquired in less than 5 years of launch because within that 5-year timeline, you can scale the brand with content, build hype, and sell out. Most D2C founders realise this and sell their brand off to a big FMCG company which systematises the whole operation but keeps the brand alive. This pattern is true for tech companies, FMCG companies, and clothing companies alike. But there is a problem here. You need to become an operator, not an owner — and that is your cap. When you get a client into the Google AI ecosystem, Google pays you 50% and keeps 50% for themselves. Now imagine, at scale, Google has hundreds of implementation partners and makes 50% from each — that's ownership. Google focuses on product, marketing, and branding. You focus on sales. Google can scale as big as they want, but for you, the scale is capped. When I asked this question back to the same 5 businessmen, all of them smiled and said it was a good question. They agreed that this model is capped and hard to scale — but it is a less risky bet than starting your own brand or product, because that requires a lot of capital to deploy upfront and the chances of going bankrupt are also very high. This strategy is good if you want to build a $10 million company, but it may not work past that. Still, it is wise to start here collect the cash, and then build your own products from there. ### If you want something no one has, endure what no one will - id: 1 - date: Mar 2026 - platform: Substack - url: https://ratios.substack.com/p/if-you-want-something-that-no-one - preview: Recently I have been going through a transition phase — from being the most capable person in the room to rooms where I'm the least capable person. Recently, in life I have been going through a transition phase, a phase where I go from being the most capable person in the room to rooms where I'm the least capable person. With everything in life, there is a phase for everything you do. Firstly you start something new where you are very unclear of what to do and constantly look for people to learn from. Next, once you establish your presence, you look to scale your work and gain the crown. And post which, it's time for you to say goodbye to your crown — because a king who spends more time in his crown chair rather than in the war field, will be defeated any day. It's crucial for you to go out in the trenches and build yourself to newer and bigger opportunities. And the feeling which I completely forgot about was how uncomfortable the start phase can be. You are the one who puts himself in an awkward position to sell himself. You are the person who desperately needs validation. You are the person who is labelled \"try hard\" — and regardless of what, you must not give up. \"I have done this before\" — the most common line that runs through my head these days. I need to constantly remind myself, I was some person who built an empire which I left to build a bigger one. This also correlated to my second learning from this phase: how important the story I tell myself is. Because every single thing is a function of that. Every thought, idea, decision, action is determined by the story I tell myself. The story you tell yourself is the environment you are creating for your mind. A victim mentality story of hate, revenge and anger will result in you always quitting when things don't work out. Last and finally — be patient and appreciate silence. Ending it, I would say to you who's reading and to myself: being in pursuit of climbing the next mountain is much better than to make one tiny achievement define your life on this planet. — Moghal Saif ### All outliers are rebels, but not all rebels are outliers - id: 2 - date: Feb 2026 - platform: Substack - url: https://ratios.substack.com/p/all-outliers-are-rebels-but-not-all - preview: My journey of entrepreneurship taught me this lesson the hard way. A few years back I heard Warren Buffett say that one of the most common mistakes founders make is being 'People stupid.' My journey of entrepreneurship taught me this lesson the hard way. A few years back I heard Warren Buffett say that one of the most common mistakes founders make is being \"People stupid\" — and even though he mentioned that most people struggle to understand it, I brainwashed myself to believe I know what he was talking about. All outliers are rebels but not all rebels are outliers. All of history's greatest founders were rebellious and there is no doubt about it, but new age founders who are getting started misinterpret that into: Being rebellious = successful. But that's the wrong equation. Rebellious is only one trait, and something that is more common in all of the greatest founders is that all of them showed traits of outlier behavior early on. Bill Gates: At 13, he spent thousands of hours programming on a teletype terminal when most adults had never even seen a computer. Jeff Bezos: As a teenager, he was building mechanical and electrical contraptions at home, treating real-world problems like engineering projects. Elon Musk: At 12, he taught himself to code and sold a video game he built, years before software was a mainstream skill. Yes, it is true that in order to do something big and lead, you must sometimes disagree and fight for what you think is the truth. But the market has never been kind to an ego-filled man who never at least gets the work done. Being a rebel, combined with being good at what you do and being consistent with your actions, is a better rule for life. For this reason, I find myself only partnering up with people who have already shown signs of greatness. This filter flushes out people who have no idea what they are talking about and gives you more time to focus on things that matter. Truth is nobody is evil at the top. Everyone just wants to get better and live a good life, and the faster you cultivate this energy, the faster you attract people with the same energy. — Moghal Saif ### If religion teaches us to be good, why are history's powerful people bad? - id: 3 - date: Dec 2025 - platform: Substack - url: https://ratios.substack.com/p/if-religion-teaches-us-to-be-good - preview: Across the world, if there is one thing that has been able to bring together a large group of people and keep them together over a long period of time, it has been religion. Across the world, if there is one thing that has been able to bring together a large group of people and keep them together over a long period of time, it has been religion. But there are so many religions in the world. And each religion believes the followers of the other religion are living an impious life, and vice versa. So who was right? Why are the stories we hear from childhood till death, through religious texts, saints, and rituals, always teaching us that good will win in the end? Because when I look at real history — at empires, civilizations, kings, dynasties — the pattern looks very different. It seems like the ruthless, the dominant, the ones willing to do bad things in pursuit of power are the ones who win. And at the end I realised: religion is made for the masses. We forget that we are the same species that once roamed naked, killing each other over food. The one who leads is the one who dominates. Dominance comes through physical size, intelligence, access to scarce resources. But cooperation was the thing that made us humans different from the rest. It took us from hunting in groups to agriculture, and today to politics and companies. Then there was another piece of the puzzle — spirituality. Humans are the only ones who were able to realize different states of consciousness. These few people had the ability to bring certainty into uncertain times. Religion became a way of life. But religion didn't stay pure. Empires and rulers used religion to align thousands of people toward a shared mission — one defined by the people at the top. The original message was slowly lost. So does that mean religion is completely made up? Yes. And does that mean we should remove religion? No. Because even now, there is no other force that can bring large groups of people together and keep them together for long periods of time. History and nature teach life more honestly than religion. Still, most rebels I know eventually take up religion. Religion provides psychological safety — living in agreement with many others reduces uncertainty and replaces isolation with belonging. — Moghal Saif ### Why you need to live an intentional life - id: 4 - date: Sep 2025 - platform: Substack - url: https://ratios.substack.com/p/why-you-need-to-live-an-intentional - preview: When someone from the outside looks at the way I live, they find it very planned and intentional — because somehow I know what I'm doing and what I'm going to do. When someone from the outside looks at the way I live, they find it very planned and intentional because somehow I know what I'm doing and what I'm going to do. And there is a reason why I live this way. I want to show you where this thought arose from — Dubai. Dubai today stands as the global city of hustle. And almost every video that talks about Dubai begins with one line: \"This was all barren sand land, until Sheikh Mohammed bin Rashid Al Maktoum decided to make Dubai into a global city.\" Which made me wonder — how can one man make one decision, and that decision change the future of so many lives? The roads, the skyscrapers, the shopping malls, the cars, the clubs, the jobs — everything was once just a thought in someone's head. So everything you do in your life is designed by a person for you to live. But my focus is on this: what we call \"life\" is something that is made up. The concept of go with the flow doesn't apply to the modern world because every single action you take is being influenced not just by social media, but by your city, your job, your community. All of it was once just a thought in some person's head. They decided to build their world in a certain way, and you became part of it. Think about it: everything you call life was built by another human. And if I don't think the person who built this system knows about me, then it's wise for me to build my own world. For me, every action must have a meaning to it, otherwise it's being done because I was influenced to do so. This always connects to Steve Jobs' saying: the world is made by people who are no smarter than you. That's why I choose to live with intention — because every small decision is an act towards building my own life. — Moghal Saif ### The next era of human survival - id: 5 - date: Sep 2025 - platform: Substack - url: https://ratios.substack.com/p/the-next-era-of-human-survival - preview: AI is going to make all 100% of people ask the most fundamental question: Who am I? Your physical leverage has been taken away. Your intellectual leverage has been taken away. Do I have food to eat? Do I have a home to stay in? Do I have clothes to wear? Oh, I do. But do I have food for the next year? Do I have this home for the rest of my life? Do I have someone who loves me? Do I have people who respect me? Who am I? To ask this question, you must be among the 1% of the people who live on this earth. But AI is going to make all of the 100% of people ask this question. In the past history of the world, we went through different phases of survival. Be it the jungle with trees or the jungle with concrete — the desire to live is always relevant. This is a game of survival, not a game of winning or losing, because the end of the race gives everyone the same medal: the medal of death. A new being is taking shape in this world — AI. For centuries, human beings were not the strongest but they were smarter and chosen by nature to dominate. AI may not be physically stronger than a human being yet, but it is already smart enough to make us humans feel dumb. So, the cycle of survival has begun. As an individual, as a being who wants to survive in this world — what do you need? Your physical leverage has been taken away. Your intellectual leverage has been taken away. What remains is something ancient and something both AI and most human beings lack. The Spiritual leverage. AI can't tap into the infinite consciousness which we can from closing our eyes. This is your leverage — being wise, knowing yourself and knowing the world. — Moghal Saif ### Most of your efforts are BS - id: 6 - date: Jan 2025 - platform: Substack - url: https://ratios.substack.com/p/most-of-your-efforts-are-bs - preview: Not all effort is created equal. The Pareto Principle — 80% of outcomes come from 20% of inputs — is a constant in life. But there's a catch. Not all effort is created equal. The Pareto Principle — 80% of outcomes come from 20% of inputs — is a constant in life. But there's a catch I found: you don't always know which 20% will matter until you've gone through the other 80%. In Atomic Habits, James Clear describes how ice doesn't melt at 35 degrees. It just sits there, cold and stubborn. But at 36 degrees, it melts. The shift feels sudden, but it's not. Every degree before 36 mattered — it just didn't show. The same is true for your work. You might feel like nothing is moving. You're putting in hours, making decisions, trying different approaches. Then one day, a breakthrough happens. Suddenly, you find the 20% of effort that drives 80% of your results. Think about a manager climbing the corporate ladder. Early in their career, they work hard on everything, not knowing what will pay off. But as they move up, they're paid for their decisions, not their effort. The leverage wasn't obvious at first — it revealed itself over time. Sometimes, to reach the 20% that matters, you have to push through the 80% that feels like it doesn't. — Moghal Saif ### dog & bull - id: 7 - date: Jan 2024 - platform: Nicheless - url: https://nicheless.blog/post/dog--bull - preview: \"To escape fear, you have to go through it, not around it.\" A few days ago I saw a dog barking and provoking a bull — the dog charged straight at it, refusing to be intimidated. \"To escape fear, you have to go through it, not around.\" — Richie Norton A few days ago, on my way to the gym, I saw a dog barking and provoking a bull, causing it to run amok. The dog didn't shy away from fear; instead, it charged straight at it, refusing to be intimidated by the bull's size. Surprisingly, the bull became the one being chased down. In this narrative, the bull symbolizes our fears, and the lesson here is that avoidance doesn't conquer it. Mike Tyson said, \"Fear is the greatest obstacle to learning. But fear is your best friend. If you learn to control it, you let it work for you. If you don't learn to control it, it'll destroy you and everything around you.\" Just as a muscle strengthens through resistance, so does our courage through facing fears. Remember Winston Churchill's words: \"Fear is a reaction. Courage is a decision.\" Our true strength emerges, not when we avoid fear, but when we face it head-on. Courage isn't automatic; it's a decision we make in the face of fear's challenges. Next time fear knocks, remember Norton's call to go through it and Tyson's reminder to master it. Until then, embrace the challenge, stay curious, and above all, stay fearless. डर . निडर ### revival - id: 8 - date: Jan 2024 - platform: Nicheless - url: https://nicheless.blog/post/revival - preview: Have you ever noticed that when an old person or a child is nearby, you can't help but look at them? It's a natural inclination — a pause in our hectic lives. Have you ever noticed that when an old person or a child is nearby, you can't help but look at them, observing every detail of what they're doing? It's a natural inclination, a pause in our hectic lives. What is it about the fragility and playfulness of the young and the elderly that captivates us? Kids play, say what they want. Old folks read, enjoy nature. They've got this freedom we seem to lose in the middle of our lives. When you're young, you're carefree. But as you grow up, there's all this pressure to achieve, earn, and prove yourself. You climb the success mountain, but sometimes it feels empty at the top. Life's not just about rushing and conquering. It's more than that. It's about living the life you really want. As you get older, you realize it's okay to slow down, read a book, enjoy the world. Happiness isn't just about reaching goals; it's about appreciating the small stuff. So, take a cue from the little ones and the elderly. Find joy in the simple things. Life's not just a race; it's a collection of moments. The wisdom is in simplicity. In the laughter of kids and the peacefulness of old folks, there's a reminder to savor life's little joys. In the midst of it all, chase after the big things, but be acutely aware of why you're in pursuit. Understand your 'why.' ### beauty of darkness - id: 9 - date: Nov 2023 - platform: Nicheless - url: https://nicheless.blog/post/beauty-of-darkness - preview: All great people have gone through hell. In our world, where we constantly compare ourselves through the touch of our phones, we've forgotten the effort it takes. All great people have gone through hell. All great individuals have endured their share of challenges. In our world, where we constantly compare ourselves through the touch of our phones, we've forgotten the effort it takes to achieve what we see on our screens. History repeatedly demonstrates that life consists of a sequence of hardships, much like the way Marcus Aurelius overcame his own struggles. Bad times, though daunting, he embraced them. A modern example would be David Goggins. Let's make it easy for you — Remember the time you studied hard for an exam and aced it the next morning? Remember the months of practice that made you perform like a miracle on the match day? Remember how much you hated being in that constant place of stress or pain? That's what greatness feels like. Dark times create resilient individuals. Darkness may be seen as the pit that we have dug, but realize the only way out of it is greatness. Life ends the moment you die. It's all about what you make of it now. When you die, nothing will matter, but as long as you live, it will haunt you. All the greatest love stories were about loss. All the greatest winner stories were about sacrifice. All the successful life stories were about comebacks. The obstacles in our way are what shape our journeys. If you go by your feelings, acknowledge that no feeling is final. The dark emotions add more flavor to the good ones. The world doesn't care about a loser's story who quit, so don't quit at your dark moments. ### respect & attention games - id: 10 - date: Oct 2023 - platform: Nicheless - url: https://nicheless.blog/post/respect--attention-games - preview: Growing up, you've probably had your parents tell you to care about what others think. This 'respect and status' stuff may seem old-fashioned to Gen Z — but they're still after the same thing: attention. Growing up, you've probably had your parents tell you to care about what others think. They want you to be respected by society. But when you shrug it off, thinking, \"Who cares?\" you're not alone. This \"respect and status\" stuff may seem old-fashioned to Gen Z, but if you look closer, they're still after something very similar: attention. For Gen Z, it's all about getting noticed online. They buy Jordans, post pictures of walls in the name of aesthetics, and listen to the same songs everyone else is listening to. On the other side, for older generations, it was about owning an expensive car, a grand house, and donating a significant amount of money to temples. It's more of the same thing, which leads to the same route. I believe seeking approval from others is something we all do. It's in our nature. We humans are social creatures. If someone says they don't care what others think, they're probably not telling the whole truth, or they are just like Buddha. Seeking validation and seeking power are very different things. People sometimes mix the two up. As you gain more influence, the people whose opinions matter to you change. So, high-status people throw big parties and buy expensive cars because they care about what their circle thinks. Someone like Mukesh Ambani won't care what you say about his daughter's lavish wedding. He cares about what the people who attended the wedding think. Same game, different rules. ### kabir & zaalima - id: 11 - date: Aug 2023 - platform: Nicheless - url: https://nicheless.blog/post/kabir--zaalima - preview: A few days back, an old friend of mine had lost his wife. Watching him made me feel the deep pain that grief holds. Yet I believe it is a beautiful thing — it shows the purity of one's love. A few days back, an old friend of mine had lost his wife. Watching him made me feel the deep pain that grief holds. Yet I believe it is a beautiful thing and it shows the purity of one's love. So I wrote this short story. Back in the day, in the town of Jasilam, there was a man named Kabir. He was known for his petroleum business and his quite stubborn attitude towards others. He had built a successful business and lived a comfortable life among the top businessmen in the town. But then, life threw an obstacle at him — his beloved wife, Zaalima, passed away. Zaalima's departure made Kabir a completely different person. A man known for his rude attitude suddenly started spending more time with his grandchildren and became kinder and friendlier. The sadness he felt was deep and hard to explain. Even though he had the money to suppress his emotions by immersing himself in pleasure, he still missed Zaalima in a way that went beyond reality. Zaalima had a big heart full of kindness and care. She was a complete opposite of Kabir. Something special about her was that she used to donate half of the money they earned from petroleum to help charities. While Kabir was focused on business, Zaalima's caring nature balanced him out. Knowingly or unknowingly, Kabir started living his life like how Zaalima would. Her passing seemed to leave a part of her goodness in him. He started being kind and understanding, just like she was. Even though she wasn't there in person, her spirit stayed with him. As time went on, Kabir's actions showed how strong the bond between them was. ### dispose purpose - id: 12 - date: Aug 2023 - platform: Nicheless - url: https://nicheless.blog/post/dispose-purpose - preview: \"Having a purpose is for fools,\" — Osho. While many self-help books argue that purpose is what keeps us going, Osho believes only machines need a purpose, not humans who are alive and capable of love. \"Having a purpose is for fools,\" — Osho While many self-help books argue that purpose is what keeps us going and positive, Osho has a different take. He believes that only machines need a purpose, not us humans who are alive and capable of love. Imagine life as a huge canvas, waiting for you to paint it your way. Life doesn't need a fixed purpose. A life without a rigid purpose is like being free to redefine yourself every day. In today's world, making a life without a strict purpose work means creating a system to support yourself financially. Interestingly, people who question the meaning of life have already moved beyond just surviving. Focus on experiences. Purpose is a short term game that the world plays to overcome the line of freedom. On the other hand, experiences let you build upon what your life is today. But it's not easy to break free from always thinking about survival. That's why many of us end up putting all our energy into having a clear purpose. Remember, life is happening while you're busy thinking about it. ### at the end, its love - id: 13 - date: Jul 2023 - platform: Nicheless - url: https://nicheless.blog/post/at-the-end-its-love - preview: Elon Musk said: \"Love is the way, no matter what.\" For a man with four wives and twelve children, it may seem easy to say such a thing, but after giving it solid thought, he is true. Elon Musk said: \"Love is the way, no matter what.\" For a man with four wives and twelve children, it may seem easy to say such a thing, but after giving it solid thought, he is true. Love is an intrinsic craving for every individual; if you were to ask anyone, they would undoubtedly recount their experiences with love. Though the way to look at it is about the tenderness of the heart rather than an attention-craving cycle. Success is a desire where you want a reason for people to love you in the capitalist world. Love has been a fundamental theme in religion for ages, frequently associated with our connection to the divine. So, what does love do to you? It completes you. Even after acquiring all your wants and desires, it is love that fills the void of incompleteness. As the saying goes, when success and happiness lack someone to share them with, they lose their true worth. Love manifests in various forms of emotions: grief is a form of unshown love, desire is a form of craving for fulfillment of love, gratitude is a form of acceptance of love, loyalty is a form of faithful love. Every good emotion is a form of love. Love is the underlying emotion. It is a form of giving and receiving; to make yourself fulfilled by fulfilling others is the art of loving. Why does love feel both hurtful and fulfilling? Why does it draw you towards the deepest pains in life while propelling you to the highest of highs? Understand: to find yourself, you must first get lost. Create a void in yourself for something beautiful. As an emotionally trauma-controlled human, all we want is to be loved and love. ### masks - id: 14 - date: Jun 2023 - platform: Nicheless - url: https://nicheless.blog/post/masks - preview: Have you had a distant relative who came to you and asked, 'Oh, you have changed so much,' only to realize later that you are not the person they thought you were? Have you had a distant relative of yours who came to you and asked, 'Oh, you have changed so much,' only to realize later that you are not the person they thought you were? Apart from the personality changes we experience in our lives, which we often refer to as phases resulting from significant life events, the truth is that we are not just one person at any given time too. In some cases, we label these different personalities as alter egos. Even individuals who commit the most extreme acts can appear normal and calm in their day-to-day lives. In our daily lives, we wear various masks. How we are with our parents is not exactly the same as how we are with our friends. Although everyone exists within the same time frame, each person has a different perspective of who you are. We are not static beings; rather, we adapt our behavior to meet the expectations and dynamics of different social contexts. Human beings are incredibly adaptable creatures, capable of living in diverse environmental conditions. But we must also understand that this adaptability extends to our psychological context. This is why existential questions like 'Who am I?' don't always make sense. You will never be just one fixed entity. Heraclitus beautifully stated, 'No man ever steps in the same river twice, for it's not the same river and he's not the same man.' Karl Marx believed that life is an act. He argued that people are not passive recipients of their circumstances but actively shape their lives through their actions. Let us remember to never label people, for we are multifaceted beings with ever-evolving alter egos. ### white horse - id: 15 - date: Jun 2023 - platform: Nicheless - url: https://nicheless.blog/post/white-horse - preview: If we were given a chance to be unique from everyone or be better than everyone, we would choose being unique. But why do we desire uniqueness over being better? Different, unique, special. If we were given a chance to be unique from everyone or be better than everyone, we would choose being unique. But why do we desire to be unique, to be treated special, and most importantly why not be better than the person next to you? The desire to be better than the person next to you also comes from a place of a desire to feel special — that you are the only one there, no one like you who can do the job. In this world, anyone can replace you, that's a fact. No matter how many hours you work, there will always be someone who would outwork you. However, I have noticed a pattern in nature: nature rewards those who are different, not necessarily those who are better. This concept extends beyond nature and finds its place in the business world as well. Companies strive to create exclusivity around their products, making customers feel special and unique when they possess them. But from this deep burning desire to be unique comes a burden of jealousy. Jealousy arises from a sense of insecurity and fear of loss. When we compare ourselves to others and feel inadequate, jealousy takes hold. The best approach is to look at ourselves as a whole. Often, when we compare ourselves to others, we fixate on specific areas of our lives and end up feeling jealous. We forget to consider the bigger picture. That is why you are who you are, for a reason. ### Enigma of happiness - id: 16 - date: May 2023 - platform: Nicheless - url: https://nicheless.blog/post/enigma-of-happiness - preview: Alfred Hitchcock said, \"Happiness is a clear horizon.\" Feelings of joy or excitement are not happiness — happiness is a place of contentment. Alfred Hitchcock said, \"Happiness is a clear horizon.\" Feelings of joy or excitement are not happiness; happiness is a place of contentment. The problem arises when we place happiness so high on our list of priorities that we forget it comes from taking action. Yes, I'm not against happiness; it is desirable. However, we have overrated its significance. Happiness alone cannot define our existence. We must acknowledge that the positives in life are intrinsically tied to the negatives we encounter. Here's a silly example I came up with while writing: Imagine negative emotions as a hole in the ground. The depth of this hole directly corresponds to the level of suffering we endure. On the other hand, positive emotions can be likened to pouring sand back into the hole. The amount of sand we pour is determined by the size of the hole, which indicates our suffering. Hence, the greater our suffering, the more profound our capacity for happiness. Happiness is not the ultimate goal but rather a byproduct of a well-lived life. Just as what goes up must come down, happiness is fleeting, and blindly chasing it will only lead to disappointment. Instead, focus on your purpose, and happiness is assured. Here are a few things to prioritize in order to find genuine happiness: 1. Find profound and lasting contentment that goes beyond the ephemeral pursuit of happiness. 2. Focus on your close relationships. 3. Be grateful. 4. Read to gain perspective. 5. Choose long term things over short term things. ### why you don't matter - id: 17 - date: Apr 2023 - platform: Nicheless - url: https://nicheless.blog/post/why-you-dont-matter - preview: We all have a sense of self, an identity that we are known for — but in reality the sense of self doesn't actually exist. We all have sense of self, an identity that we are known for, but in reality the sense of self doesn't actually exist. Your perception and thoughts of the world are born from the environment you are now in and the environment you grew up in as a child. Your character is what you are to others — what you show others is what they think you are, and others are the ones that assign you an identity, and you just approve to the social contract. When you die, people remember who you were to them or what you were to other humans, but not what you were to yourself. The concept of 'you' doesn't matter. Most people are so in this self-love drama that they forget that to love others is to love yourself. What you are to others is what truly matters, not for the sake of being remembered, but because that's what makes you into who you are. You are what you are to your people, period. ### space, emptiness and silence - id: 18 - date: Mar 2023 - platform: Nicheless - url: https://nicheless.blog/post/space-emptiness-and-silence - preview: More than words, silence speaks harder. More than being full, emptiness makes things clear. More than always being occupied, space makes things happen. More than words, silence speaks harder. More than being full, emptiness makes things clear. More than always being occupied, space makes things happen. Being present everywhere can make you empty from inside. People need space to fill themselves up and come back with a better understanding of who they are. Charles Bukowski had a similar saying: \"People empty me, I have to get away to refill.\" The only way you are going to discover yourself is giving yourself space, and it is good to note that space is not something you can force. You can't lock yourself in a room and expect to come back as a more polished person. Space also means giving time for things to happen. One of the best feelings is being content, being full — and opposite to it is emptiness. But to feel empty is to make space for newer things. If you want to grow, you must empty your cup when it is needed. Emptiness can allow us to let go of old patterns and beliefs that no longer serve us, making space for new and better things to come into our lives. Blaise Pascal says: \"All of humanity's problems stem from man's inability to sit quietly in a room alone.\" We as a generation are so frightened to be in silence. Silence triggers and brings back all the underlying emotions and thoughts. Get comfortable with silence. If you want to be human, be creative — you must consume and put yourself into silence to let the magic happen. One thing you will realize after spending time with yourself: you will feel deeper and have a more clear mind. ### delusional - id: 19 - date: Mar 2023 - platform: Nicheless - url: https://nicheless.blog/post/delusional - preview: This is a personal note, nothing wise. I consider myself to be a very disciplined and wise person for my age. But there are moments where I feel — where is this wisdom even leading me to? This is a personal note, nothing wise. I consider myself to be a very disciplined and wise person for my age. But there are moments where I feel, where is this wisdom even leading me to. All the people I know do cool stuff and are living just amazingly. How to make sure that what I'm doing — excluding myself from every fun thing, just to win in the long term — doesn't make me feel low in the present? I can't have relationships with people anymore, it is less heart to heart and more brain to brain. Only if I see value in the other person do I invest time into them. I'm running out of people to love and trust, more careless about emotions. Loving is so demonized but being loved is overcelebrated. When your soul isn't full, nothing feels joyful. I'm no one's love and no one is my love. Not a friend that I trust upon, not a family to hold upon. What am I? I didn't ask for unachievable things. Things that bring life to us is what I asked for. I can't make the difference between what I'm doing is good or bad, whether these are good days or bad days, or if all this is just an illusion. I meet few people who completely admire me but they don't know this person has no life in him — he is as lifeless as a grave. There is no juice to my life. ### levels of experience - id: 20 - date: Feb 2023 - platform: Nicheless - url: https://nicheless.blog/post/levels-of-experience - preview: The beauty of human existence lies in the fact that no two people are the same. Even in the same situation, two individuals can have completely contrasting emotions. The beauty of human existence lies in the fact that no two people are the same. Even in the same situation, two individuals can have completely contrasting emotions. This phenomenon is what makes life interesting, and it is a testament to the richness and complexity of human experiences. There is a famous quote that goes, \"Every mortal experiences death, but only a few experience life.\" From what I understand, the quote refers to experiences. Not all humans feel the same way, and this is what makes different emotions mean different things to different people. The levels of experience are what differentiate us. For instance, a five-year-old kid who gets his favorite chocolate is happy, just like a man who gets his first-ever job is happy. However, the difference lies in the level of happiness and joy experienced. What seems impossible for some people can be a daily chore for others. It is fascinating to see how different our lives are, even though we are all the same. This diversity is what makes us human, and it's what makes life worth living. The beauty of human existence lies in our uniqueness. We all experience emotions differently, and that is what makes us who we are. Our diverse experiences are what enrich our lives and make it worth living. ### Letting go... - id: 21 - date: Feb 2023 - platform: Nicheless - url: https://nicheless.blog/post/letting-go - preview: As we grow and mature, we realize that life is an art of letting go. We must let go of our past, our present, and even our future. The more we cling onto things, the more we suffocate ourselves. As we grow and mature, we realize that life is an art of letting go. We must let go of our past, our present, and even our future. The more we cling onto things, the more we suffocate ourselves, and eventually die in grief. It's important to understand that life is a series of events, where one event ends and another begins. You should never identify yourself as a single person; instead, you should look at yourself as a collection of experiences and memories. In this way, you can be whoever you want to be at any given moment in time. However, the most common reason why people struggle to let go is because they hold on to things too tightly. They become attached to the past and refuse to embrace the future. They believe that if they let go, they will lose what they have. But, in reality, letting go is the only way to make room for new experiences and opportunities. The most happy people in the world look at life as an experiment. They understand that happiness does not come from external factors, but from within. They don't have 1000 desires about how things should be, but instead, they accept life for what it is. They reduce their emotions and become more rational. In conclusion, it is what it is. ### best thing to do when you feel low - id: 22 - date: Jan 2023 - platform: Nicheless - url: https://nicheless.blog/post/best-thing-to-do-when-you-feel - preview: Regardless of what you do, we all have little moments in our daily life where our minds get cluttered up with all kinds of negative thoughts. So, what do you do to get yourself out of it? Regardless of what you do, we all have little moments in our daily life, where our minds get cluttered up with all kinds of negative thoughts. So, what do you do to get yourself out of it? I read a lot of self-help books, and everyone seems to have a different answer to this issue. Personally, I tried every suggestion they made, but nothing was successful. Yet, there was one sentence that I found to be effective. \"Do your work.\" Regardless of how you feel, do your work. The negative thinking cloud merely seems to dissipate when you exert yourself and do some task. Zach Pogrob has a related thought to this. When you feel down or anxious — turn your body on by exercising or going out for a run. When you feel worn out or overstimulated — turn your body off, by meditating or journaling. Understanding that emotions are a type of response tool of our brain is essential. It is not you, I repeat. If there is good, there must also be bad — this is a natural rule. Also as a side note: please read \"The Chinese Farmer\" if you have time. ### Why intellectuals live a miserable life - id: 23 - date: Jan 2023 - platform: Nicheless - url: https://nicheless.blog/post/why-intellectuals-live-a-miser - preview: Why is it that you see most philosophers talking about high performance rarely act upon them and are high performers themselves? Why is it that you see most of the philosophers talking about high performance rarely act upon them and are high performers? Philosophers tend to romanticize life in their heads and yet don't see the beauty of the world they live in. I have read some of the works of Alan Watts, Jiddu Krishnamurti, Osho and many more. After all the reading, I found what they are doing is observing the world and making patterns out of them. I believe philosophy is great for knowledge and to have a different lens to see the world, but they don't really \"help\" you. You can read thousands of books but still end up confused. It's like having a courtroom inside your head. I have spent 2 years reading books like these and took a break from them to see what difference it has made on me. That is when I realized these philosophies will not help you grow in life. Take this: do you think the people we read of, read any one of the books written by people before them? Probably no. Then, how do we get out of this rabbit hole? Do. Do things and explore the world that will help you achieve peace and fulfillment. Sitting at your desk and learning about life will surely make you depressed and will make this false image of achievement that is just like a mirage. ### 12 Realizations of 2021 - id: 24 - date: Dec 2021 - platform: Medium - url: https://moghalsaif.medium.com/12-realizations-of-2021-b1a983a31674 - preview: Philosophy explains things and that's the problem — you should not pursue philosophy but use philosophy in the thing that you are pursuing. Philosophy explains things and that's the problem — you should not pursue philosophy but use philosophy in the thing that you are pursuing. This is the reason why most philosophers that seem to know everything about life tend to just live a normal life. You can't get successful with consistency without improving yourself each time. Consistency is just patience with reflections. Being patient while still asking yourself what went wrong each time is the way success is achieved through consistency. If you prioritize the things you want more, then the things you want become the things you need. The easiest way to achieve freedom is by never upgrading your life. Everyone is a slave, everyone is a king. It all depends on the people you are with. Most people make their meaning of life through the things which they don't have. Writing is more thinking than actually writing. That's why journaling helps us restore gratitude. An observation from history: great things are made in the constraints of time. Great humans are made in the free walls of time. We work more for validation rather than money. Everybody needs to maintain a focused and wandering state of mind. The habits of today's communities will become superstitions of the future communities. At a high level, the amount of love you show someone is based upon how much emotion, time, and effort you put into the relationship. That's the reason why friendships and love relationships are hard to distinguish. Most intelligent people's outlook on life is as a whole, while stupid people's outlook on life is in parts. ## Books - Greatest Minds And Ideas Of All Times (/book-covers/book-001.jpg) - Modern Poker Theory: Building an Unbeata (/book-covers/book-002.jpg) - Operation Mind Control (/book-covers/book-003.jpg) - A Man for All Markets (/book-covers/book-004.jpg) - The Goal: A Process of Ongoing Improvement (/book-covers/book-005.jpg) - THE FORBIDDEN UNIVERSE (/book-covers/book-006.jpg) - Pregnant Darkness: Alchemy and the Rebirth of Consciousness (/book-covers/book-007.jpg) - The Rosicrucian Cosmo-Conception (/book-covers/book-008.jpg) - Tarot of Ceremonial Magick: A Pictorial Synthesis of Three Great Pillars of Magick : Enochian, Goetia, Astrology (/book-covers/book-009.jpg) - On the Art of the Kabbalah/De Arte Cabalistica (/book-covers/book-010.jpg) - The Hermetic and Alchemical Writings of Paracelsus (/book-covers/book-011.jpg) - Greek Magical Papyri in Translation: Texts Volume 1 (/book-covers/book-012.jpg) - Zohar: The Book of Splendor: Basic Readings from the Kabbalah (/book-covers/book-013.jpg) - Three books of occult philosophy or magic (/book-covers/book-014.jpg) - Initiation into Hermetics (/book-covers/book-015.jpg) - Real Magic: An Introductory Treatise on the Basic Principles of Yellow Light (/book-covers/book-016.jpg) - The Masonic Initiation: Expanded Centennial Edition (/book-covers/book-017.jpg) - Freemasonry And The Ancient Gods (/book-covers/book-018.jpg) - The History of Magic (/book-covers/book-019.jpg) - The Hieroglyphic Monad (/book-covers/book-020.jpg) - The Complete Picatrix: The Occult Classic of Astrological Magic Liber Atratus Edition (/book-covers/book-021.jpg) - The Chymical Wedding of Christian Rosenkreutz (/book-covers/book-022.jpg) - Sefer Yetzira/The Book of Creation: In Theory and Practice - Napoleon's Rules (/book-covers/book-024.jpg) - The Military Maxims of Napoleon (/book-covers/book-025.jpg) - World Order (/book-covers/book-026.jpg) - Diplomacy (/book-covers/book-027.jpg) - Leadership: Six Studies in World Strate